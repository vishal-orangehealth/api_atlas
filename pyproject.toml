[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-atlas"
version = "0.2.0"
description = "Explore a web app in the browser and get a working, chained API test suite (pytest or Postman)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "playwright>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "requests>=2.31"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
atlas = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
